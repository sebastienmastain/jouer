*{box-sizing:border-box;margin:0;padding:0}
html{font-size:17px}
body{font-family:'Body',system-ui,sans-serif;font-weight:600;background:#f7efe1;color:#3a2618;min-height:100vh;padding:max(14px,env(safe-area-inset-top)) 14px 90px;-webkit-tap-highlight-color:transparent}
body.dark{background:#1b1412;color:#f5ead6}
h1,h2,.disp{font-family:'Disp',Georgia,serif;font-weight:800;line-height:1.15}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:16px 18px;background:#b3202c;color:#fff;box-shadow:0 4px 0 rgba(0,0,0,.25);width:100%;margin:6px 0;font-size:1.05rem}
button:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(0,0,0,.25)}
button.g{background:#1f5b3f} button.o{background:#c9952e} button.gh{background:transparent;color:inherit;border:2px solid currentColor;box-shadow:none}
button.sel{outline:4px solid #e8b04a;outline-offset:2px;background:#1f5b3f}
button[disabled]{opacity:.4}
input,textarea{font:inherit;font-weight:800;width:100%;padding:14px;border-radius:12px;border:2px solid #d9c49c;background:#fff;color:#3a2618;margin:6px 0;font-size:1.1rem}
.top{display:flex;justify-content:space-between;align-items:center;font-size:.8rem;opacity:.75;margin-bottom:10px}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#2c8a4f;margin-right:5px}.dot.off{background:#c33}
.t{font-size:.8rem;letter-spacing:.15em;text-transform:uppercase;color:#1f5b3f;margin-bottom:6px} body.dark .t{color:#d8b26a}
.big{font-family:'Disp';font-weight:800;font-size:2.3rem;line-height:1.15;text-align:center;margin:18px 0;word-wrap:break-word}
.txt{font-size:1.1rem;line-height:1.5;margin:8px 0}
.sec{margin:12px 0}.sec h3{font-size:.85rem;letter-spacing:.1em;text-transform:uppercase;color:#7a1b25;margin-bottom:4px} body.dark .sec h3{color:#d8b26a}
.sec p{line-height:1.5}
.sec.dk{background:#2a1d16;color:#f4ead6;padding:12px;border-radius:12px} body.dark .sec.dk{background:#f4ead6;color:#2a1d16}
.sec.hl{border-left:5px solid #b3202c;padding-left:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.grid button{margin:0;min-height:70px}
.timer{font-family:'Disp';font-size:3rem;text-align:center;color:#1f5b3f} .timer.hot{color:#b3202c}
.fb{padding:14px;border-radius:12px;margin:10px 0;font-size:1.15rem;text-align:center}
.fb.ok{background:#e3f4e6;color:#1d6b3a}.fb.no{background:#fbe3e3;color:#8e1a24}
.bingo{display:grid;gap:6px}
.bingo div{background:#fff;border:2px solid #e2cfa6;border-radius:10px;min-height:68px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:.85rem;padding:4px;color:#3a2618}
.bingo div.dr{border-color:#c9952e;background:#fff6dc}.bingo div.mk{background:#1f5b3f;color:#fff;border-color:#1f5b3f}
.buzz{width:min(70vw,280px);height:min(70vw,280px);border-radius:50%;font-size:1.8rem;display:block;margin:20px auto;background:radial-gradient(circle at 35% 30%,#ff5c6c,#b3202c 60%,#7a0f18);box-shadow:0 10px 0 #5c0b12}
.lst{list-style:none}.lst li{background:rgba(0,0,0,.05);border-radius:10px;padding:10px;margin:6px 0;line-height:1.4}
img.pg{width:100%;border-radius:10px;margin:8px 0}
.foot{position:fixed;bottom:0;left:0;right:0;text-align:center;font-size:.7rem;opacity:.55;padding:8px}

<script>// ---- Réseau « tous connectés » (Line Sagnelys) : relais MQTT publics, sans compte ni abonnement ----
// Les téléphones ne reçoivent que ce que l'écran de l'hôte leur envoie : aucun contenu du jeu n'est stocké en ligne.
const NET = (() => {
  const BROKERS = ['wss://broker.emqx.io:8084/mqtt', 'wss://broker.hivemq.com:8884/mqtt', 'wss://test.mosquitto.org:8081'];
  const PFX = 'lsagnelys-jeux-v1/';
  const ABC = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789';
  const qs = new URLSearchParams(location.search);
  const forced = qs.get('broker');
  function code(n = 5) { let s = ''; const a = new Uint32Array(n); crypto.getRandomValues(a); a.forEach(x => s += ABC[x % ABC.length]); return s }
  function uid() { return code(10) }
  function tryConnect(list, onOk, onFail, i = 0) {
    if (i >= list.length) { onFail(); return }
    let done = false;
    const c = mqtt.connect(list[i], { connectTimeout: 7000, reconnectPeriod: 2500, clean: true, clientId: 'ls_' + uid() });
    const t = setTimeout(() => { if (!done) { done = true; try { c.end(true) } catch (e) {} tryConnect(list, onOk, onFail, i + 1) } }, 8000);
    c.on('connect', () => { if (done) return; done = true; clearTimeout(t); onOk(c, list[i]) });
    c.on('error', () => {});
  }
  function connect(onOk, onFail) { tryConnect(forced ? [forced] : BROKERS, onOk, onFail) }
  const enc = o => JSON.stringify(o), dec = b => { try { return JSON.parse(typeof b === 'string' ? b : new TextDecoder().decode(b)) } catch (e) { return null } };

  // ---------- côté écran de l'hôte ----------
  function Host(game, opts = {}) {
    const H = { code: opts.code || code(), players: {}, client: null, status: 'off', onAct: null, onChange: null, onStatus: null, ui: {} };
    const base = PFX + game + '/' + H.code + '/';
    H.start = () => {
      H.status = 'connexion'; H.onStatus && H.onStatus(H.status);
      connect((c, url) => {
        H.client = c; H.status = 'ok'; H.broker = url; H.onStatus && H.onStatus('ok');
        c.subscribe(base + 'up', { qos: 1 });
        c.on('message', (t, m) => {
          const o = dec(m); if (!o || !o.pid) return;
          let p = H.players[o.pid];
          if (o.t === 'hello') {
            const isNew = !p;
            p = H.players[o.pid] = Object.assign(p || { pid: o.pid, team: null, score: 0 }, { name: String(o.name || 'Joueur').slice(0, 24), last: Date.now(), on: true });
            H.send(o.pid, H.ui[o.pid] || H.lobbyUi(o.pid));
            H.onChange && H.onChange(isNew ? 'join' : 'back', p);
          } else if (o.t === 'ping') { if (p) { p.last = Date.now(); if (!p.on) { p.on = true; H.onChange && H.onChange('back', p) } } else { c.publish(base + 'p/' + o.pid, enc({ t: 'who' }), { qos: 1 }) } }
          else if (o.t === 'act' && p) { p.last = Date.now(); H.onAct && H.onAct(p, o.id, o.val) }
          else if (o.t === 'bye' && p) { p.on = false; H.onChange && H.onChange('left', p) }
        });
        c.on('close', () => { H.status = 'reconnexion'; H.onStatus && H.onStatus(H.status) });
        c.on('reconnect', () => {}); c.on('connect', () => { H.status = 'ok'; H.onStatus && H.onStatus('ok') });
      }, () => { H.status = 'echec'; H.onStatus && H.onStatus('echec') });
      // joueurs silencieux depuis 20 s = déconnectés
      H.iv = setInterval(() => { const now = Date.now(); Object.values(H.players).forEach(p => { if (p.on && !p.local && now - p.last > 20000) { p.on = false; H.onChange && H.onChange('left', p) } }) }, 5000);
    };
    H.send = (pid, ui) => { H.ui[pid] = ui; const p = H.players[pid]; if (p && p.local) { H.onLocalUi && H.onLocalUi(p, ui); return } if (H.client) H.client.publish(base + 'p/' + pid, enc({ t: 'ui', ui }), { qos: 1 }) };
    H.addLocal = (name) => { const pid = 'TV' + uid().slice(0, 6); const p = H.players[pid] = { pid, name: String(name || 'Joueur').slice(0, 24), team: null, score: 0, on: true, local: true, last: Date.now() }; H.onChange && H.onChange('join', p); return p };
    H.localAct = (pid, id, val) => { const p = H.players[pid]; if (p) H.onAct && H.onAct(p, id, val) };
    H.remove = (pid) => { delete H.players[pid]; delete H.ui[pid]; H.onChange && H.onChange('left', { pid }) };
    H.each = (fn) => Object.values(H.players).forEach(p => { const u = fn(p); if (u) H.send(p.pid, u) });
    H.all = (ui) => H.each(() => ui);
    H.list = () => Object.values(H.players);
    H.online = () => Object.values(H.players).filter(p => p.on);
    H.lobbyUi = (pid) => ({ title: 'Bienvenue !', big: '👋', text: "Tu es dans la partie. Regarde l'écran principal : ça commence bientôt." });
    H.url = () => (opts.manette || 'https://sebastienmastain.github.io/jouer/') + '?g=' + game + '&c=' + H.code + (forced ? '&broker=' + encodeURIComponent(forced) : '');
    H.stop = () => { clearInterval(H.iv); try { H.client && H.client.end(true) } catch (e) {} H.status = 'off' };
    return H;
  }

  // ---------- côté téléphone (manette) ----------
  function Player(game, roomCode, name, onUi, onStatus) {
    let pid; try { pid = localStorage.getItem('ls_pid') } catch (e) {}
    if (!pid) { pid = uid(); try { localStorage.setItem('ls_pid', pid) } catch (e) {} }
    const P = { pid, client: null };
    const base = PFX + game + '/' + roomCode + '/';
    const hello = () => P.client && P.client.publish(base + 'up', enc({ t: 'hello', pid, name }), { qos: 1 });
    connect((c) => {
      P.client = c; onStatus('ok');
      c.subscribe(base + 'p/' + pid, { qos: 1 }, () => hello());
      c.on('message', (t, m) => { const o = dec(m); if (!o) return; if (o.t === 'ui') onUi(o.ui); if (o.t === 'who') hello() });
      c.on('connect', () => { onStatus('ok'); hello() }); c.on('close', () => onStatus('reconnexion'));
      P.iv = setInterval(() => c.publish(base + 'up', enc({ t: 'ping', pid }), { qos: 0 }), 5000);
    }, () => onStatus('echec'));
    P.act = (id, val) => P.client && P.client.publish(base + 'up', enc({ t: 'act', pid, id, val }), { qos: 1 });
    return P;
  }
  return { Host, Player, code };
})();

<script>// ---- Affichage d'un écran de joueur (le même sur téléphone, tablette et télé) ----
function MUI_render(app, ui, act, local){
 local=local||{};
 const el=(tag,cls,txt)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e};
 const prevIn=(local.ui&&local.ui.input&&ui.input&&local.ui.input.id===ui.input.id)?(app.querySelector('input')||{}).value:null;
 const hadFocus=document.activeElement&&document.activeElement.tagName==='INPUT'&&app.contains(document.activeElement);
 local.ui=ui; clearInterval(local.tmr); app.innerHTML=''; app.classList.toggle('dark',!!ui.dark);
 if(ui.vibrate&&navigator.vibrate&&!local.tv) navigator.vibrate(ui.vibrate===true?120:ui.vibrate);
 if(ui.title) app.append(el('div','t',ui.title));
 if(ui.feedback) app.append(el('div','fb '+(ui.feedback.ok?'ok':'no'),ui.feedback.msg));
 if(ui.big) app.append(el('div','big',ui.big));
 if(ui.img){ const i=el('img','pg'); i.src=ui.img; i.alt=''; app.append(i) }
 if(ui.text) app.append(el('p','txt',ui.text));
 (ui.lines||[]).forEach(l=>app.append(el('p','txt',l)));
 (ui.sections||[]).forEach(s=>{ const d=el('div','sec'+(s.dark?' dk':'')+(s.hl?' hl':'')); if(s.h)d.append(el('h3',null,s.h)); (Array.isArray(s.p)?s.p:[s.p]).forEach(t=>t&&d.append(el('p',null,t))); app.append(d) });
 if(ui.list){ const u=el('ul','lst'); ui.list.forEach(t=>u.append(el('li',null,t))); app.append(u) }
 if(ui.timer){ const t=el('div','timer'); app.append(t); let left=ui.timer; const draw=()=>{t.textContent=left>=60?Math.floor(left/60)+':'+String(left%60).padStart(2,'0'):left; t.classList.toggle('hot',left<=5)}; draw(); local.tmr=setInterval(()=>{left=Math.max(0,left-1);draw();if(!left)clearInterval(local.tmr)},1000) }
 if(ui.buzzer){ const b=el('button','buzz',ui.buzzer.label||'BUZZ !'); b.onclick=()=>{ act(ui.buzzer.id,1); b.disabled=true; b.textContent='✔' }; if(ui.buzzer.off)b.disabled=true; app.append(b) }
 if(ui.choices){ const c=ui.choices, g=el('div',c.cols===1?'':'grid'); let sel=c.sel;
   c.items.forEach(it=>{ const b=el('button',it.cls||'g',it.label); if(sel===it.v)b.classList.add('sel'); if(c.lock)b.disabled=true;
     b.onclick=()=>{ sel=it.v; [...g.children].forEach(x=>x.classList.remove('sel')); b.classList.add('sel'); act(c.id,it.v); if(c.once)[...g.children].forEach(x=>x.disabled=true) }; g.append(b) }); app.append(g) }
 if(ui.input){ const i=ui.input, f=el('input'); f.placeholder=i.ph||''; if(i.max)f.maxLength=i.max; if(i.upper){f.autocapitalize='characters';f.style.textTransform='uppercase'} f.value=prevIn!=null?prevIn:(i.val||'');
   const b=el('button','g',i.btn||'Envoyer'); const go=()=>{ if(!f.value.trim())return; act(i.id,f.value.trim()); if(i.clear)f.value=''; b.textContent='Envoyé ✔'; setTimeout(()=>b.textContent=i.btn||'Envoyer',1200) };
   b.onclick=go; f.onkeydown=e=>{if(e.key==='Enter')go()}; app.append(f,b); if(prevIn!=null&&hadFocus)setTimeout(()=>f.focus(),0) }
 if(ui.fields){ const fs=ui.fields, ins=fs.items.map(lb=>{ const f=el('input'); f.placeholder=lb; return f }); ins.forEach(f=>app.append(f));
   const b=el('button','g',fs.btn||'Envoyer'); b.onclick=()=>{ act(fs.id, ins.map(f=>f.value.trim())); b.textContent='Envoyé ✔' }; app.append(b) }
 if(ui.bingo){ const B=ui.bingo, n=B.n||4, g=el('div','bingo'); g.style.gridTemplateColumns=`repeat(${n},1fr)`; const key='bg_'+B.id; let mk=(local[key]||[]);
   B.cells.forEach((c,i)=>{ const d=el('div',null,c); const dr=!B.drawn||B.drawn.includes(c); if(B.drawn&&dr)d.classList.add('dr'); if(mk.includes(i))d.classList.add('mk');
     d.onclick=()=>{ if(B.drawn&&!dr){ d.style.opacity=.4; setTimeout(()=>d.style.opacity=1,300); return } mk=mk.includes(i)?mk.filter(x=>x!==i):mk.concat(i); local[key]=mk; d.classList.toggle('mk') }; g.append(d) });
   app.append(g); const b=el('button','o','BINGO !'); b.onclick=()=>act(B.id,(local[key]||[]).map(i=>B.cells[i])); app.append(b) }
 (ui.buttons||[]).forEach(bt=>{ const b=el('button',bt.cls||null,bt.label); if(bt.off)b.disabled=true; b.onclick=()=>{ act(bt.id,bt.val==null?1:bt.val); if(bt.once)b.disabled=true }; app.append(b) });
 return local;
}

<script>
const $=s=>document.querySelector(s); const qs=new URLSearchParams(location.search);
let P=null, UI=null, local={}, tmr=null;
const app=$('#app');
function el(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!=null)e.textContent=txt;return e}
function status(s){ $('#st').innerHTML=''; const d=el('span','dot'+(s==='ok'?'':' off')); $('#st').append(d, s==='ok'?'Connecté':(s==='echec'?'Pas de connexion Internet':'Connexion…')); if(s==='echec') showErr() }
function showErr(){ app.innerHTML=''; app.append(el('h2','disp','Connexion impossible'), el('p','txt',"Ton téléphone n'arrive pas à rejoindre la partie. Vérifie qu'il a Internet (Wi-Fi ou 4G), puis réessaie."));
 const b=el('button',null,'Réessayer'); b.onclick=()=>location.reload(); app.append(b) }
// ---- écran d'accueil : code + prénom ----
function joinForm(){
 app.innerHTML=''; const g=qs.get('g');
 app.append(el('div','t','Rejoindre la partie'), el('h1','disp','À toi de jouer !'));
 app.append(el('p','txt',"Tape le code affiché sur l'écran principal, et ton prénom."));
 const c=el('input'); c.placeholder='Code (5 lettres)'; c.maxLength=5; c.autocapitalize='characters'; c.value=(qs.get('c')||'').toUpperCase(); c.style.textTransform='uppercase'; c.style.letterSpacing='.3em';
 const n=el('input'); n.placeholder='Ton prénom'; n.maxLength=20; try{n.value=localStorage.getItem('ls_name')||''}catch(e){}
 const b=el('button','g','Rejoindre');
 b.onclick=()=>{ const code=c.value.trim().toUpperCase(), name=n.value.trim(); if(code.length!==5||!name){ c.focus(); return }
   try{localStorage.setItem('ls_name',name)}catch(e){}
   $('#me').textContent=name; app.innerHTML=''; app.append(el('div','big','⏳'), el('p','txt','Connexion à la partie '+code+'…'));
   P=NET.Player(g||'jeu', code, name, render, status); keepAwake() };
 app.append(c,n,b); if(c.value) n.focus();
 if(!g) app.append(el('p','txt',"Astuce : scanne le QR code de l'écran principal, le code se remplit tout seul."));
}
// ---- garder l'écran allumé ----
let lock=null; async function keepAwake(){ try{ lock=await navigator.wakeLock.request('screen') }catch(e){} }
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'&&P) keepAwake() });
// ---- affichage de ce que l'hôte envoie ----
let LOC={};
function render(ui){ UI=ui; if(ui.vibrate&&navigator.vibrate) navigator.vibrate(ui.vibrate===true?120:ui.vibrate); const scroll=!(LOC.ui&&LOC.ui.input&&ui.input); LOC=MUI_render(app, ui, (id,v)=>{ P.act(id,v); if(navigator.vibrate)navigator.vibrate(30) }, LOC); document.body.classList.toggle('dark',!!ui.dark); if(scroll)window.scrollTo(0,0) }
joinForm();
</script></body></html>
